services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bentop
      POSTGRES_PASSWORD: bentop_secret
      POSTGRES_DB: bentop_erp
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bentop -d bentop_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://bentop:bentop_secret@db:5432/bentop_erp?schema=public
      AUTH_SECRET: bentop-erp-production-secret-change-me
      AUTH_URL: https://erp.bentoperp.com
      NEXTAUTH_URL: https://erp.bentoperp.com
      NEXT_PUBLIC_AUTH_URL: https://erp.bentoperp.com
      AUTH_TRUST_HOST: https://erp.bentoperp.com
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
