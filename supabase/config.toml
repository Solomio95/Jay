project_id = "bentop-hr"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081"]
jwt_expiry = 3600
enable_signup = false
enable_refresh_token_rotation = true

[auth.sms]
enable_signup = false
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.erp-sync-sales]
verify_jwt = false

[functions.commission-run]
verify_jwt = true

[functions.payroll-run]
verify_jwt = true
